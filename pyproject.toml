[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-cat"
description = "A tiny desktop pet you can control from Python."
version = "0.1.1"
authors = [
    { name = "Angelina Zhu", email="az3231@nyu.edu" },
    { name = "Daran Tung", email="dyt2010@nyu.edu" },
    { name = "Anthony Wang", email="aw4580@nyu.edu" },
    { name = "Sara Herschmann", email="smh9864@nyu.edu" },
    { name = "Tristan McCrea", email="ttm2041@nyu.edu" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials"]

[project.urls]
"Homepage" = "https://github.com/software-students-fall2026/python-package-exercise-busy-bees"

[tool.setuptools.package-data]
desktop_cat = ["**/*.png"]
