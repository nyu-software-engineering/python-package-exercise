
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "team-a-games-package"
version = "0.1.0"
description = "A collection of Python mini-games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame",
    "pyspellchecker"
]

[project.scripts]
play_tetris = "games_package.tetris:main"
play_hangman = "games_package.hangman:start_game"
play_wordle = "games_package.wordle:play_wordle"
play_2048 = "games_package.game_2048:play_2048"
play_blackjack = "games_package.blackjack:play_blackjack"

[tool.setuptools.packages.find]
include = ["games_package*"]
