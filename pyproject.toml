
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "team-a-games-package"
version = "0.1.0"
description = "A collection of Python mini-games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame",
    "pyspellchecker"
]

[tool.setuptools.packages.find]
include = ["games_package*"]
