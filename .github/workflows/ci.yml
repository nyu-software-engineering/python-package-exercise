# Taken from continuous integration lecture notes and slightly modified (runs tests on 2 versions of Python on push and pull request to main)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[gui]" pytest build twine

      - name: Build package
        run: python -m build

      - name: Check package distributions
        run: python -m twine check dist/*

      - name: Run tests
        run: pytest