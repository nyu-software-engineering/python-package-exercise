name: Test and build

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PIPENV_VENV_IN_PROJECT: "1"
      PIPENV_IGNORE_VIRTUALENVS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pipenv
        run: python -m pip install pipenv==2026.11.0
      - name: Install locked dependencies
        run: |
          pipenv --python "$(command -v python)"
          pipenv verify
          pipenv sync --dev
          pipenv run python -m pip check
      - name: Install Chromium
        run: pipenv run python -m playwright install --with-deps chromium
      - name: Run tests
        run: pipenv run test
      - name: Build source distribution and wheel
        run: pipenv run build
      - name: Test installed wheel and run example
        run: |
          pipenv requirements --dev-only --hash > "$RUNNER_TEMP/dev-requirements.txt"
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --require-hashes -r "$RUNNER_TEMP/dev-requirements.txt"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --no-deps --no-index dist/*.whl
          cp -R tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -I -m pytest --import-mode=importlib tests --ignore=tests/test_quest_form.py --ignore=tests/test_quest_creation_api.py --ignore=tests/test_quest_read_api.py --ignore=tests/test_quest_mutation_api.py --ignore=tests/test_quest_completion_api.py --ignore=tests/test_quest_planner.py --ignore=tests/test_quest_list_ui.py --ignore=tests/test_planner_persistence_e2e.py
          "$RUNNER_TEMP/wheel-check/bin/python" -I "$GITHUB_WORKSPACE/examples/basic_usage.py"