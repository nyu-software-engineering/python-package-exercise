name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install pipenv and Pipfile packages
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev
