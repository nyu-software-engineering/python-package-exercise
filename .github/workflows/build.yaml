name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # avoids stalled builds
    strategy:
      fail-fast: false # show all failures
      matrix:
        python-version: ["3.11", "3.15"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipenv and dependencies
        run: |
          python -m pip install pipenv
          pipenv install --dev

      - name: Test package
        run: pipenv run pytest # run tests from /tests

      - name: Build package
        run: pipenv run python -m build
